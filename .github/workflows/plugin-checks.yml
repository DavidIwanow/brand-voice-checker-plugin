name: Plugin checks

# Runs on every push and pull request, before each release, and once a week so a
# dead link or a down MCP server is noticed even when nothing in the repo changes.
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Manifest, skill and consistency
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Offline checks (JSON, manifest, icon, skill front matter, README vs skill)
        run: python .github/scripts/check_plugin.py

      - name: Version bump (pull requests that change shipped files)
        if: github.event_name == 'pull_request'
        run: python .github/scripts/check_plugin.py --base-ref "origin/${{ github.base_ref }}"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # The plugin directory's own validator. Pinned so a new release cannot change
      # the verdict without a commit here; bump the version deliberately.
      # --strict fails on warnings (unknown fields, missing metadata); --profile directory
      # adds the plugin directory's submission checks. With marketplace.json present,
      # validating "." checks the marketplace, so plugin.json is validated on its own too.
      - name: Official validator (marketplace and plugin directory checks)
        run: npx --yes @anthropic-ai/claude-code@2.1.329 plugin validate --strict --profile directory .

      - name: Official validator (plugin.json)
        run: npx --yes @anthropic-ai/claude-code@2.1.329 plugin validate --strict .claude-plugin/plugin.json

  online:
    name: Links and MCP endpoint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Live URLs and MCP server answer
        run: python .github/scripts/check_plugin.py --online
